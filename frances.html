<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Francés B1 - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen py-10 px-4 text-slate-800">

<div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-3xl p-6 md:p-10 border border-slate-100">

    <header class="mb-8 border-b pb-4 flex justify-between items-center flex-wrap gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                Traductor Francés 🇫🇷 <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded-full uppercase">Nivel B1</span>
            </h1>
            <p class="text-sm text-slate-500 mt-1">
                Basado en francés estándar · Pronunciación figurada en alfabeto español
            </p>
        </div>
    </header>

    <div class="mb-5">
        <label for="direccion" class="block text-sm font-semibold text-slate-700 mb-2">
            Dirección de traducción:
        </label>
        <select id="direccion" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            <option value="es-fr">Español ➔ Francés</option>
            <option value="fr-es">Francés ➔ Español</option>
        </select>
    </div>

    <div class="mb-5">
        <div class="flex justify-between items-center mb-2">
            <label for="texto" class="text-sm font-semibold text-slate-700">
                Texto o frase:
            </label>
            <button onclick="iniciarVoz()" id="btnMicrofono" aria-label="Dictar por voz" class="flex items-center gap-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-sm">
                🎙️ Dictar por voz
            </button>
        </div>
        <div class="relative">
            <textarea id="texto" rows="4" maxlength="300" autocomplete="off" placeholder="Escribe o dicta cualquier palabra o frase..." oninput="actualizarContador()" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition text-sm"></textarea>
            <span id="contadorCaracteres" class="absolute bottom-3 right-3 text-xs text-slate-400">0/300</span>
        </div>
    </div>

    <button id="btnTraducir" onclick="traducir()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/30 flex justify-center items-center gap-2">
        <span>Traducir y Analizar</span>
    </button>

    <div id="loading" class="hidden text-center my-6 text-slate-500 animate-pulse font-medium text-sm">
        Traduciendo al instante...
    </div>

    <div id="resultado" class="hidden mt-8 border-t pt-6 space-y-6">

        <div>
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">
                    Traducción obtenida:
                </h2>
                <button onclick="copiarTraduccion()" class="text-xs text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
                    📋 Copiar texto
                </button>
            </div>
            <div id="traduccion" class="text-xl font-bold text-slate-900 bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-inner"></div>
            <div id="pronunciacionFigurada" class="text-sm text-amber-600 mt-2 px-1 font-mono"></div>
        </div>

        <div class="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-5 shadow-sm">
            <h2 class="font-bold text-emerald-900 mb-3 flex items-center gap-2 text-sm">
                🔊 Pronunciación Interactiva
            </h2>

            <div class="flex gap-2 flex-wrap items-center">
                <button onclick="reproducirAudio()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-md shadow-emerald-600/20">
                    ▶️ Reproducir
                </button>
                <button onclick="detenerAudio()" class="bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition">
                    ⏹️ Detener
                </button>

                <div class="ml-auto flex items-center gap-2">
                    <label class="text-xs font-semibold text-emerald-800">Velocidad:</label>
                    <select id="velocidad" aria-label="Velocidad de audio" class="px-2.5 py-1.5 border border-emerald-300 rounded-xl text-xs bg-white text-emerald-900 font-medium focus:outline-none">
                        <option value="0.7">0.7x (Lenta)</option>
                        <option value="0.8">0.8x</option>
                        <option value="0.9" selected>0.9x (Normal)</option>
                        <option value="1">1.0x (Rápida)</option>
                    </select>
                </div>
            </div>

            <div id="estadoAudio" class="text-xs text-emerald-700 mt-3 font-medium">
                Listo para reproducir
            </div>
        </div>

        <div>
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                Orientación gramatical B1
            </h2>
            <div id="gramatica" class="bg-blue-50/70 border border-blue-200 rounded-2xl p-4 text-sm text-slate-700 leading-relaxed shadow-sm"></div>
        </div>

    </div>

    <div id="historialContainer" class="hidden mt-10 pt-6 border-t border-slate-200">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Historial reciente:</h3>
        <div id="listaHistorial" class="space-y-2"></div>
    </div>

</div>

<script>
let voces = [];
let textoParaAudio = "";
let idiomaAudio = "fr-FR";
let historial = [];

/* ============================================================
   FRANCÉS → ALFABETO ESPAÑOL (transliteración aproximada)
   Reglas básicas para que el usuario hispanohablante lea francés.
   ============================================================ */
function transliterarFrances(texto) {
    if (!texto) return "";
    let s = texto;
    // Grupos más largos primero
    s = s.replace(/eaux/g, 'ó');
    s = s.replace(/eau/g, 'ó');
    s = s.replace(/aux/g, 'ó');
    s = s.replace(/au/g, 'ó');
    s = s.replace(/ai/g, 'e');
    s = s.replace(/ei/g, 'e');
    s = s.replace(/oi/g, 'ua');
    s = s.replace(/ou/g, 'u');
    s = s.replace(/on/g, 'ón');
    s = s.replace(/an/g, 'án');
    s = s.replace(/en/g, 'án');
    s = s.replace(/in/g, 'én');
    s = s.replace(/un/g, 'ön');
    s = s.replace(/ch/g, 'sh');
    s = s.replace(/gn/g, 'ñ');
    s = s.replace(/ph/g, 'f');
    s = s.replace(/th/g, 't');
    s = s.replace(/qu/g, 'k');
    s = s.replace(/ç/g, 's');
    s = s.replace(/é/g, 'e');
    s = s.replace(/è/g, 'e');
    s = s.replace(/ê/g, 'e');
    s = s.replace(/à/g, 'a');
    s = s.replace(/â/g, 'a');
    s = s.replace(/ù/g, 'u');
    s = s.replace(/û/g, 'u');
    s = s.replace(/ô/g, 'o');
    s = s.replace(/î/g, 'i');
    s = s.replace(/ï/g, 'i');
    s = s.replace(/œ/g, 'ö');
    s = s.replace(/j/g, 'y');
    s = s.replace(/r/g, 'r');
    // al final de palabra: consonantes mudas (simplificado)
    s = s.replace(/[stdxz]\b/g, '');
    s = s.replace(/e\b/g, '');
    return s;
}

function contieneFrances(texto) {
    return /[éèêàâùûôîïçœ]/i.test(texto) || /\b(le|la|les|un|une|des|je|tu|il|elle|nous|vous|ils|elles|est|sont|et|ou|donc|or|ni|car)\b/i.test(texto);
}

function cargarVoces() {
    if (!("speechSynthesis" in window)) return;
    voces = window.speechSynthesis.getVoices();
}
cargarVoces();
if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = cargarVoces;
}

function buscarVoz(idioma) {
    if (!voces.length) voces = window.speechSynthesis.getVoices();
    let voz = voces.find(v => v.lang.toLowerCase() === idioma.toLowerCase());
    if (voz) return voz;
    const base = idioma.substring(0, 2).toLowerCase();
    return voces.find(v => v.lang.toLowerCase().startsWith(base)) || null;
}

function actualizarContador() {
    const texto = document.getElementById("texto").value;
    document.getElementById("contadorCaracteres").innerText = `${texto.length}/300`;
}

async function traducir() {
    const textoOriginal = document.getElementById("texto").value.trim();
    const direccion = document.getElementById("direccion").value;

    if (!textoOriginal) {
        alert("Por favor, escribe una palabra o frase para traducir.");
        return;
    }

    const loading = document.getElementById("loading");
    const resultado = document.getElementById("resultado");
    const boton = document.getElementById("btnTraducir");

    loading.classList.remove("hidden");
    resultado.classList.add("hidden");
    boton.disabled = true;
    detenerAudio();

    idiomaAudio = direccion === "es-fr" ? "fr-FR" : "es-ES";

    const cacheKey = `traduccion_fr_${direccion}_${textoOriginal}`;
    const guardada = localStorage.getItem(cacheKey);
    if (guardada) {
        mostrarResultado(guardada, direccion, textoOriginal, true);
        loading.classList.add("hidden");
        resultado.classList.remove("hidden");
        boton.disabled = false;
        return;
    }

    const langFrom = direccion === "es-fr" ? "es" : "fr";
    const langTo = direccion === "es-fr" ? "fr" : "es";
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${langFrom}&tl=${langTo}&dt=t&q=${encodeURIComponent(textoOriginal)}`;

    try {
        const respuesta = await fetch(url);
        if (!respuesta.ok) throw new Error("No se pudo conectar con el servicio de traducción.");
        const datos = await respuesta.json();
        if (!datos || !datos[0]) throw new Error("No se encontró una traducción válida.");

        let traduccion = datos[0].map(seg => seg[0]).join('');
        localStorage.setItem(cacheKey, traduccion);
        mostrarResultado(traduccion, direccion, textoOriginal, false);
        resultado.classList.remove("hidden");

    } catch (error) {
        console.error(error);
        alert("Error al traducir: " + error.message);
    } finally {
        loading.classList.add("hidden");
        boton.disabled = false;
    }
}

function mostrarResultado(traduccionReal, direccion, textoOriginal, desdeCache) {
    let textoMostrado = traduccionReal;
    let pronunciacion = "";

    if (direccion === "es-fr") {
        textoParaAudio = traduccionReal;
        pronunciacion = `🔊 Pronunciación figurada: ${transliterarFrances(traduccionReal)}`;
    } else {
        textoParaAudio = traduccionReal;
        pronunciacion = "";
    }

    document.getElementById("traduccion").innerText = textoMostrado;
    document.getElementById("pronunciacionFigurada").innerText = pronunciacion;

    const gram = direccion === "es-fr"
        ? `
            <strong class="text-blue-900 block mb-1">💡 Consejos B1 (ES ➔ Francés):</strong>
            <ul class="list-disc ml-5 space-y-1">
                <li>El francés tiene <strong>dos auxiliares</strong> en passé composé: <em>avoir</em> y <em>être</em>. Con verbos de movimiento se usa <em>être</em>: <em>je suis allé</em> (fui).</li>
                <li>Las <strong>terminaciones verbales</strong> son clave: <em>-er</em> (hablar), <em>-ir</em> (finir), <em>-re</em> (vendre).</li>
                <li>El <strong>partitivo</strong> se usa para cantidades indeterminadas: <em>du pain</em> (pan), <em>de la soupe</em> (sopa).</li>
                <li>La <strong>negación</strong> rodea al verbo: <em>je ne parle pas</em> (no hablo).</li>
                <li>El <strong>acento</strong> cae en la última sílaba pronunciada de la palabra o grupo fónico.</li>
            </ul>
        `
        : `
            <strong class="text-blue-900 block mb-1">💡 Consejos B1 (Francés ➔ Español):</strong>
            <ul class="list-disc ml-5 space-y-1">
                <li>Si ves <strong>ne... pas</strong>, es una negación: <em>je ne sais pas</em> (no sé).</li>
                <li>El <strong>passé composé</strong> equivale al pretérito perfecto o indefinido español: <em>j'ai mangé</em> (he comido / comí).</li>
                <li>El <strong>imparfait</strong> se usa para descripciones y acciones habituales en el pasado: <em>je mangeais</em> (comía).</li>
                <li>Las palabras <strong>mudas al final</strong> no se pronuncian: <em>petit</em> suena "petí".</li>
            </ul>
        `;
    document.getElementById("gramatica").innerHTML = gram;

    agregarAlHistorial(textoOriginal, textoMostrado);
}

function reproducirAudio() {
    if (!textoParaAudio) { alert("Primero realiza una traducción."); return; }
    if (!("speechSynthesis" in window)) { alert("Tu navegador no soporta síntesis de voz."); return; }
    window.speechSynthesis.cancel();
    const velocidad = parseFloat(document.getElementById("velocidad").value);
    const estado = document.getElementById("estadoAudio");
    const mensaje = new SpeechSynthesisUtterance(textoParaAudio);
    mensaje.lang = idiomaAudio;
    mensaje.rate = velocidad;
    const voz = buscarVoz(idiomaAudio);
    if (voz) { mensaje.voice = voz; estado.innerText = `🔊 Reproduciendo (${voz.name})`; }
    else { estado.innerText = "🔊 Reproduciendo audio..."; }
    mensaje.onend = () => { estado.innerText = "✓ Audio finalizado"; };
    window.speechSynthesis.speak(mensaje);
}

function detenerAudio() {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    const estado = document.getElementById("estadoAudio");
    if (estado) estado.innerText = "Audio detenido";
}

function copiarTraduccion() {
    const texto = document.getElementById("traduccion").innerText;
    navigator.clipboard.writeText(texto).then(() => alert("¡Traducción copiada!"));
}

function agregarAlHistorial(orig, trad) {
    historial.unshift({ orig, trad });
    if (historial.length > 3) historial.pop();
    const lista = document.getElementById("listaHistorial");
    lista.innerHTML = "";
    historial.forEach(item => {
        const div = document.createElement("div");
        div.className = "text-xs bg-slate-50 border border-slate-200 p-2.5 rounded-xl flex justify-between items-center";
        div.innerHTML = `<span class="truncate max-w-[180px] font-medium"><strong>${item.orig}</strong></span> <span class="text-slate-400">➔</span> <span class="truncate max-w-[180px] text-blue-700 font-semibold">${item.trad}</span>`;
        lista.appendChild(div);
    });
    document.getElementById("historialContainer").classList.remove("hidden");
}

function iniciarVoz() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Reconocimiento de voz no disponible. Usa Chrome o Edge."); return; }
    const rec = new SR();
    const direccion = document.getElementById("direccion").value;
    rec.lang = direccion === "es-fr" ? "es-ES" : "fr-FR";
    rec.continuous = false;
    rec.interimResults = false;
    const boton = document.getElementById("btnMicrofono");
    boton.innerText = "🎙️ Escuchando...";
    boton.classList.add("bg-rose-100");
    rec.onresult = (e) => {
        document.getElementById("texto").value = e.results[0][0].transcript;
        actualizarContador();
        boton.innerText = "🎙️ Dictar por voz";
        boton.classList.remove("bg-rose-100");
    };
    rec.onerror = () => { boton.innerText = "🎙️ Dictar por voz"; boton.classList.remove("bg-rose-100"); };
    rec.onend = () => { boton.innerText = "🎙️ Dictar por voz"; boton.classList.remove("bg-rose-100"); };
    try { rec.start(); } catch(e) { boton.innerText = "🎙️ Dictar por voz"; boton.classList.remove("bg-rose-100"); }
}
</script>

</body>
</html>
