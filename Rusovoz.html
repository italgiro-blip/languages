<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Ruso  B1 - Pro (Lectura en español)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen py-10 px-4 text-slate-800">

<div class="max-w-3xl mx-auto bg-white shadow-2xl rounded-3xl p-6 md:p-10 border border-slate-100">

    <!-- Cabecera -->
    <header class="mb-8 border-b pb-4 flex justify-between items-center flex-wrap gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center gap-2">
                Traductor Ruso_voz 🇷🇺 <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded-full uppercase">Nivel B1</span>
            </h1>
            <p class="text-sm text-slate-500 mt-1">
                Traducción inteligente · Lectura en alfabeto español · Análisis gramatical
            </p>
        </div>
    </header>

    <!-- Dirección -->
    <div class="mb-5">
        <label for="direccion" class="block text-sm font-semibold text-slate-700 mb-2">
            Dirección de traducción:
        </label>
        <select id="direccion" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            <option value="es-ru">Español ➔ Ruso (con lectura en español)</option>
            <option value="ru-es">Ruso ➔ Español</option>
        </select>
    </div>

    <!-- Texto de entrada -->
    <div class="mb-5">
        <div class="flex justify-between items-center mb-2">
            <label for="texto" class="text-sm font-semibold text-slate-700">
                Texto o frase:
            </label>
            <button onclick="iniciarVoz()" id="btnMicrofono" aria-label="Dictar por voz" class="flex items-center gap-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-3 py-1.5 rounded-xl text-xs font-medium transition shadow-sm">
                🎙️ Dictar por voz
            </button>
        </div>
        <div class="relative">
            <textarea id="texto" rows="4" maxlength="300" autocomplete="off" placeholder="Escribe o dicta cualquier palabra o frase..." oninput="actualizarContador()" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition text-sm"></textarea>
            <span id="contadorCaracteres" class="absolute bottom-3 right-3 text-xs text-slate-400">0/300</span>
        </div>
    </div>

    <!-- Botón Traducir -->
    <button id="btnTraducir" onclick="traducir()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/30 flex justify-center items-center gap-2">
        <span>Traducir y Analizar</span>
    </button>

    <!-- Cargando -->
    <div id="loading" class="hidden text-center my-6 text-slate-500 animate-pulse font-medium text-sm">
        Traduciendo al instante...
    </div>

    <!-- Resultado -->
    <div id="resultado" class="hidden mt-8 border-t pt-6 space-y-6">

        <!-- Bloque Traducción -->
        <div>
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">
                    Traducción obtenida:
                </h2>
                <button onclick="copiarTraduccion()" class="text-xs text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1">
                    📋 Copiar texto
                </button>
            </div>
            <div id="traduccion" class="text-xl font-bold text-slate-900 bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-inner"></div>
            <div id="cirilico" class="text-sm text-slate-500 mt-2 px-1"></div>
        </div>

        <!-- Bloque Audio / Pronunciación -->
        <div class="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-5 shadow-sm">
            <h2 class="font-bold text-emerald-900 mb-3 flex items-center gap-2 text-sm">
                🔊 Pronunciación Interactiva
            </h2>

            <div class="flex gap-2 flex-wrap items-center">
                <button onclick="reproducirAudio()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-md shadow-emerald-600/20">
                    ▶️ Reproducir
                </button>
                <button onclick="detenerAudio()" class="bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 px-4 py-2 rounded-xl text-sm font-medium transition">
                    ⏹️ Detener
                </button>

                <div class="ml-auto flex items-center gap-2">
                    <label class="text-xs font-semibold text-emerald-800">Velocidad:</label>
                    <select id="velocidad" aria-label="Velocidad de audio" class="px-2.5 py-1.5 border border-emerald-300 rounded-xl text-xs bg-white text-emerald-900 font-medium focus:outline-none">
                        <option value="0.7">0.7x (Lenta)</option>
                        <option value="0.8">0.8x</option>
                        <option value="0.9" selected>0.9x (Normal)</option>
                        <option value="1">1.0x (Rápida)</option>
                    </select>
                </div>
            </div>

            <div id="estadoAudio" class="text-xs text-emerald-700 mt-3 font-medium">
                Listo para reproducir
            </div>
        </div>

        <!-- Bloque Gramática B1 -->
        <div>
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                Orientación gramatical B1
            </h2>
            <div id="gramatica" class="bg-blue-50/70 border border-blue-200 rounded-2xl p-4 text-sm text-slate-700 leading-relaxed shadow-sm"></div>
        </div>

    </div>

    <!-- Historial -->
    <div id="historialContainer" class="hidden mt-10 pt-6 border-t border-slate-200">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Historial reciente:</h3>
        <div id="listaHistorial" class="space-y-2"></div>
    </div>

</div>

<script>
let voces = [];
let textoParaAudio = "";      // Texto real (cirílico) que se lee en voz alta
let idiomaAudio = "ru-RU";
let historial = [];

/* ============================================================
   TRANSLITERACIÓN RUSO (cirílico) → ALFABETO ESPAÑOL
   Basada en las reglas fonéticas del ruso estándar.
   ============================================================ */
function transliterarRuso(texto) {
    if (!texto) return "";
    const mapa = {
        'А':'A','а':'a',
        'Б':'B','б':'b',
        'В':'V','в':'v',
        'Г':'G','г':'g',
        'Д':'D','д':'d',
        'Е':'Ye','е':'ye',
        'Ё':'Yo','ё':'yo',
        'Ж':'Zh','ж':'zh',
        'З':'Z','з':'z',
        'И':'I','и':'i',
        'Й':'Y','й':'y',
        'К':'K','к':'k',
        'Л':'L','л':'l',
        'М':'M','м':'m',
        'Н':'N','н':'n',
        'О':'O','о':'o',
        'П':'P','п':'p',
        'Р':'R','р':'r',
        'С':'S','с':'s',
        'Т':'T','т':'t',
        'У':'U','у':'u',
        'Ф':'F','ф':'f',
        'Х':'J','х':'j',      // jota suave (como en "Juan")
        'Ц':'Ts','ц':'ts',
        'Ч':'Ch','ч':'ch',
        'Ш':'Sh','ш':'sh',
        'Щ':'Shch','щ':'shch',
        'Ъ':'','ъ':'',        // signo duro: no se pronuncia
        'Ы':'Y','ы':'y',      // vocal entre "i" y "u"
        'Ь':"'",'ь':"",       // signo blando: suaviza
        'Э':'E','э':'e',
        'Ю':'Yu','ю':'yu',
        'Я':'Ya','я':'ya'
    };
    let salida = "";
    for (const ch of texto) {
        salida += (mapa[ch] !== undefined ? mapa[ch] : ch);
    }
    return salida;
}

/* ============================================================
   Detectar si un texto contiene caracteres cirílicos
   ============================================================ */
function contieneCirilico(texto) {
    return /[\u0400-\u04FF]/.test(texto);
}

function cargarVoces() {
    if (!("speechSynthesis" in window)) return;
    voces = window.speechSynthesis.getVoices();
}

cargarVoces();
if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = cargarVoces;
}

function buscarVoz(idioma) {
    if (!voces.length) voces = window.speechSynthesis.getVoices();
    let voz = voces.find(v => v.lang.toLowerCase() === idioma.toLowerCase());
    if (voz) return voz;
    const base = idioma.substring(0, 2).toLowerCase();
    return voces.find(v => v.lang.toLowerCase().startsWith(base)) || null;
}

function actualizarContador() {
    const texto = document.getElementById("texto").value;
    document.getElementById("contadorCaracteres").innerText = `${texto.length}/300`;
}

async function traducir() {
    const textoOriginal = document.getElementById("texto").value.trim();
    const textoLimpio = textoOriginal.replace(/[¿?¡!.,]/g, '').trim();
    const textoParaDiccionario = textoLimpio.toLowerCase();
    const direccion = document.getElementById("direccion").value;

    if (!textoOriginal) {
        alert("Por favor, escribe una palabra o frase para traducir.");
        return;
    }

    const loading = document.getElementById("loading");
    const resultado = document.getElementById("resultado");
    const boton = document.getElementById("btnTraducir");

    loading.classList.remove("hidden");
    resultado.classList.add("hidden");
    boton.disabled = true;

    detenerAudio();

    idiomaAudio = direccion === "es-ru" ? "ru-RU" : "es-ES";

    // 1. Caché local
    const cacheKey = `traduccion_${direccion}_${textoOriginal}`;
    const traduccionGuardada = localStorage.getItem(cacheKey);

    if (traduccionGuardada) {
        mostrarResultado(traduccionGuardada, direccion, textoOriginal, true);
        loading.classList.add("hidden");
        resultado.classList.remove("hidden");
        boton.disabled = false;
        return;
    }

    // Diccionario local estricto
    const diccionarioExacto = {
        "buenos dias": "Доброе утро",
        "buenos días": "Доброе утро",
        "buenas tardes": "Добрый день",
        "buenas noches": "Доброй ночи",
        "hola": "Привет",
        "como estas": "Как дела?",
        "cómo estás": "Как дела?",
        "gracias": "Спасибо",
        "por favor": "Пожалуйста",
        "adios": "До свидания",
        "adiós": "До свидания"
    };

    if (direccion === 'es-ru' && diccionarioExacto[textoParaDiccionario]) {
        const traduccion = diccionarioExacto[textoParaDiccionario];
        localStorage.setItem(cacheKey, traduccion);
        mostrarResultado(traduccion, direccion, textoOriginal, false, true);
        loading.classList.add("hidden");
        resultado.classList.remove("hidden");
        boton.disabled = false;
        return;
    }

    // 2. Google Translate sin API Key
    const langFrom = direccion === "es-ru" ? "es" : "ru";
    const langTo = direccion === "es-ru" ? "ru" : "es";

    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${langFrom}&tl=${langTo}&dt=t&q=${encodeURIComponent(textoOriginal)}`;

    try {
        const respuesta = await fetch(url);
        if (!respuesta.ok) throw new Error("No se pudo conectar con el servicio de traducción.");

        const datos = await respuesta.json();
        if (!datos || !datos[0]) {
            throw new Error("No se encontró una traducción válida.");
        }

        const traduccion = datos[0].map(segmento => segmento[0]).join('');
        localStorage.setItem(cacheKey, traduccion);

        mostrarResultado(traduccion, direccion, textoOriginal, false, false);

        resultado.classList.remove("hidden");

    } catch (error) {
        console.error(error);
        alert("Error al traducir: " + error.message);
    } finally {
        loading.classList.add("hidden");
        boton.disabled = false;
    }
}

/* ============================================================
   Muestra el resultado aplicando transliteración cuando sea ruso
   ============================================================ */
function mostrarResultado(traduccionReal, direccion, textoOriginal, desdeCache, desdeDiccionario) {
    let textoMostrado;
    let notaCirilico = "";

    // Si la dirección es ES→RU, la traducción viene en cirílico.
    // Mostramos la transliteración al alfabeto español.
    if (direccion === "es-ru" && contieneCirilico(traduccionReal)) {
        textoMostrado = transliterarRuso(traduccionReal);
        notaCirilico = `Cirílico original: ${traduccionReal}`;
        textoParaAudio = traduccionReal; // el audio se sintetiza con ruso real
    } else {
        textoMostrado = traduccionReal;
        textoParaAudio = traduccionReal;
    }

    document.getElementById("traduccion").innerText = textoMostrado;
    document.getElementById("cirilico").innerText = notaCirilico;

    // Gramática
    let gram = "";
    if (desdeCache) {
        gram = `
            <strong class="text-blue-900 block mb-1">💡 Análisis B1 (Caché local):</strong>
            <p>Traducción recuperada instantáneamente sin consumir solicitudes adicionales.</p>
        `;
    } else if (desdeDiccionario) {
        gram = `
            <strong class="text-blue-900 block mb-1">💡 Análisis B1 sugerido:</strong>
            <p>Expresión cotidiana exacta corregida localmente para garantizar precisión absoluta en ruso.</p>
        `;
    } else if (direccion === "es-ru") {
        gram = `
            <strong class="text-blue-900 block mb-1">💡 Consejos clave para nivel B1 (ES ➔ RU):</strong>
            <ul class="list-disc ml-5 space-y-1">
                <li>El ruso <strong>no tiene artículos</strong> (ni "el/la" ni "un/una"): el contexto y el caso lo determinan.</li>
                <li>El <strong>orden de las palabras es flexible</strong>, pero el caso (Nominativo, Acusativo, Genitivo, Dativo, Instrumental, Preposicional) marca la función.</li>
                <li>Recuerda el <strong>aspecto verbal</strong>: imperfectivo (proceso) vs. perfectivo (resultado). Ej.: <em>chitát' / prochitát'</em> (leer / haber leído).</li>
                <li>La lectura en alfabeto español es orientativa. La "х" rusa suena como jota suave, y "ы" es un sonido intermedio entre i y u.</li>
            </ul>
        `;
    } else {
        gram = `
            <strong class="text-blue-900 block mb-1">💡 Consejos clave para nivel B1 (RU ➔ ES):</strong>
            <ul class="list-disc ml-5 space-y-1">
                <li>Identifica el <strong>caso</strong> de los sustantivos para saber si son sujeto, objeto directo o indirecto.</li>
                <li>Fíjate en el <strong>aspecto del verbo</strong>: si es perfectivo, suele traducirse con pretérito o futuro puntual.</li>
                <li>Detecta <strong>verbos de movimiento con prefijo</strong> (pri-, u-, po-, vy-) para elegir el verbo español correcto.</li>
                <li>Conectores frecuentes: <em>potomú chto</em> (porque), <em>jotyá</em> (aunque), <em>poétamu</em> (por eso).</li>
            </ul>
        `;
    }
    document.getElementById("gramatica").innerHTML = gram;

    agregarAlHistorial(textoOriginal, textoMostrado);
}

function reproducirAudio() {
    if (!textoParaAudio) {
        alert("Primero realiza una traducción.");
        return;
    }
    if (!("speechSynthesis" in window)) {
        alert("Tu navegador no soporta síntesis de voz.");
        return;
    }

    window.speechSynthesis.cancel();

    const velocidad = parseFloat(document.getElementById("velocidad").value);
    const estado = document.getElementById("estadoAudio");
    const mensaje = new SpeechSynthesisUtterance(textoParaAudio);

    mensaje.lang = idiomaAudio;
    mensaje.rate = velocidad;
    mensaje.volume = 1;
    mensaje.pitch = 1;

    const voz = buscarVoz(idiomaAudio);
    if (voz) {
        mensaje.voice = voz;
        estado.innerText = `🔊 Reproduciendo con voz nativa (${voz.name})`;
    } else {
        estado.innerText = "🔊 Reproduciendo audio...";
    }

    mensaje.onend = () => { estado.innerText = "✓ Audio finalizado con éxito"; };
    mensaje.onerror = () => { estado.innerText = "⚠️ Error al reproducir audio"; };

    window.speechSynthesis.speak(mensaje);
}

function detenerAudio() {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    const estado = document.getElementById("estadoAudio");
    if (estado) estado.innerText = "Audio detenido";
}

function copiarTraduccion() {
    const texto = document.getElementById("traduccion").innerText;
    navigator.clipboard.writeText(texto).then(() => {
        alert("¡Traducción copiada al portapapeles!");
    });
}

function agregarAlHistorial(orig, trad) {
    historial.unshift({ orig, trad });
    if (historial.length > 3) historial.pop();

    const contenedor = document.getElementById("historialContainer");
    const lista = document.getElementById("listaHistorial");
    lista.innerHTML = "";

    historial.forEach(item => {
        const div = document.createElement("div");
        div.className = "text-xs bg-slate-50 border border-slate-200 p-2.5 rounded-xl flex justify-between items-center";
        div.innerHTML = `<span class="truncate max-w-[180px] font-medium"><strong>${item.orig}</strong></span> <span class="text-slate-400">➔</span> <span class="truncate max-w-[180px] text-blue-700 font-semibold">${item.trad}</span>`;
        lista.appendChild(div);
    });

    contenedor.classList.remove("hidden");
}

function iniciarVoz() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("El reconocimiento de voz no está disponible en este navegador. Utiliza Google Chrome o Microsoft Edge.");
        return;
    }

    const reconocimiento = new SpeechRecognition();
    const direccion = document.getElementById("direccion").value;
    reconocimiento.lang = direccion === "es-ru" ? "es-ES" : "ru-RU";
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;

    const boton = document.getElementById("btnMicrofono");
    boton.innerText = "🎙️ Escuchando...";
    boton.classList.add("bg-rose-100");

    reconocimiento.onresult = (event) => {
        document.getElementById("texto").value = event.results[0][0].transcript;
        actualizarContador();
        boton.innerText = "🎙️ Dictar por voz";
        boton.classList.remove("bg-rose-100");
    };

    reconocimiento.onerror = () => {
        boton.innerText = "🎙️ Dictar por voz";
        boton.classList.remove("bg-rose-100");
    };

    reconocimiento.onend = () => {
        boton.innerText = "🎙️ Dictar por voz";
        boton.classList.remove("bg-rose-100");
    };

    try {
        reconocimiento.start();
    } catch (e) {
        boton.innerText = "🎙️ Dictar por voz";
        boton.classList.remove("bg-rose-100");
    }
}
</script>

</body>
</html>
